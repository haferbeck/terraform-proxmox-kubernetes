include:
  - component: $CI_SERVER_FQDN/devops/pipeline-components/init@refactor/terraform-modues
  - component: $CI_SERVER_FQDN/devops/pipeline-components/tofu-test@refactor/terraform-modues
    inputs:
      module_name: kubernetes
      module_root: .
      enable_github_code_scanning: true
      github_repo: haferbeck/terraform-proxmox-kubernetes
  - component: $CI_SERVER_FQDN/devops/pipeline-components/tofu-release@refactor/terraform-modues
    inputs:
      module_name: kubernetes
      module_system: proxmox
      module_root: .
      version_source: tag
      github_repo: haferbeck/terraform-proxmox-kubernetes

stages:
  - init
  - validate
  - test
  - publish
  - release
